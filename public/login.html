<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Timo Social Hub · Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f1;--surface:#fff;--ink:#14201b;--muted:#5a6a63;--line:#dde3dd;--accent:#0c7a5e;--accent-ink:#fff;--bad:#c53030;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1412;--surface:#151d1a;--ink:#e4ebe8;--muted:#91a29b;--line:#283530;--accent:#3cc29a;--accent-ink:#04261c;--bad:#f07272;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'IBM Plex Sans',system-ui,sans-serif;display:grid;place-items:center;padding:16px}
form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(380px,100%);display:flex;flex-direction:column;gap:14px}
h1{font:700 24px/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
p{margin:0;color:var(--muted);font-size:14px}
label{font-size:13px;font-weight:500;color:var(--muted)}
input{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
button{font:inherit;font-weight:500;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:10px;cursor:pointer}
button[disabled]{opacity:.6}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#err{color:var(--bad);font-size:13px;min-height:1em}
</style>
</head>
<body>
<form id="f">
  <h1>Timo Social</h1>
  <p>Client pages hub</p>
  <div><label for="pw">Password</label><input type="password" id="pw" autocomplete="current-password" required autofocus></div>
  <span id="err" role="alert"></span>
  <button id="go">Log in</button>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('go'),er=document.getElementById('err');b.disabled=true;er.textContent='';
  try{const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});
    if(r.ok){location.href='/';return}const j=await r.json().catch(()=>({}));er.textContent=j.error||'Could not log in.'}catch(x){er.textContent='Could not reach the server.'}b.disabled=false});
</script>
</body>
</html>
